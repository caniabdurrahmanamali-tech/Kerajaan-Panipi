 <!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Sejarah Gorontalo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            overflow: hidden;
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
        }

        #game-box {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
        }

        #karakter {
            width: 130px;
            height: auto;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        #dialog-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
        }

        #teks-dialog {
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        /* Desain area peta agar rapi di dalam game */
        #peta-game {
            width: 100%; 
            height: 230px; 
            border: 1px solid #ccc; 
            border-radius: 8px;
            display: none; 
            margin-bottom: 15px;
        }

        .btn-aksi {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            text-align: center;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
        }

        .btn-peta {
            background: #007BFF;
        }

        .btn-sejarah {
            background: #28a745;
        }
    </style>
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="video-bg.mp4" type="video/mp4">
</video>

<div id="game-box">
    <!-- MUSIK & KARAKTER -->
    <audio id="musik-game" src="lagu.mp3" loop autoplay controls style="width: 100%; margin-bottom: 10px;"></audio>
    <img id="karakter" src="karakter.png" alt="Pemandu Wisata">
    
    <!-- KOTAK DIALOG EDUKASI -->
    <div id="dialog-box">
        <p id="teks-dialog">Halo! Selamat datang di petualangan sejarah Gorontalo. Yuk, klik tombol biru di bawah!</p>
    </div>

    <!-- PETA (Dipindahkan ke luar dialog-box agar aman dari tindihan teks JavaScript) -->
    <iframe id="peta-game" src="https://openstreetmap.org"></iframe>

    <!-- TOMBOL AKSI -->
    <button class="btn-aksi btn-peta" onclick="bukaPetaDiDalamGame()">MULAI JALAN-JALAN</button>
    <button class="btn-aksi btn-sejarah" onclick="gantiTeks()">PELAJARI SEJARAH</button>
</div>

<script>
    let info = [
        "Raja Bobihoe memimpin Kerajaan Panipi dan mengobarkan Perang Panipi melawan Belanda pada tahun 1872.",
        "Akibat perlawanan tersebut, beliau ditangkap lalu diasingkan oleh pihak Belanda.",
        "Kini, makam Raja Panipi terletak di Desa Barakati, Kecamatan Batudaa, Kabupaten Gorontalo.",
        "Yuk, bagikan game edukasi ini ke teman-temanmu untuk melestarikan sejarah lokal kita!"
    ];
    let indeks = 0;

    function gantiTeks() {
        // Sembunyikan peta secara otomatis saat tombol sejarah ditekan agar fokus ke cerita
        document.getElementById('peta-game').style.display = 'none';

        if (indeks < info.length) {
            document.getElementById('teks-dialog').innerText = info[indeks];
            indeks = indeks + 1;
        } else {
            indeks = 0;
            document.getElementById('teks-dialog').innerText = "Yuk, bagikan game edukasi ini ke teman-temanmu untuk melestarikan sejarah lokal kita!";
        }
    }

    function bukaPetaDiDalamGame() {
        let peta = document.getElementById('peta-game');
        peta.style.display = 'block'; // Menampilkan peta
        document.getElementById('teks-dialog').innerText = "Berikut adalah peta wilayah Kabupaten Gorontalo (Batudaa & Barakati). Silakan pelajari lokasinya!";
    }
</script>

</body>
</html>
