<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Sejarah Gorontalo</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background-color: #f4f6f9; font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; text-align: center; }
        #game-box { width: 90%; max-width: 400px; background: white; padding: 30px 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: 3px solid #28a745; position: relative; box-sizing: border-box; }
        #karakter { width: 130px; height: auto; margin-bottom: 15px; filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.15)); }
        #dialog-box { background: #f8f9fa; padding: 15px; border-radius: 12px; border: 1px solid #ddd; margin-bottom: 20px; }
        #teks-dialog { margin: 0; font-size: 14px; color: #333; line-height: 1.5; font-weight: bold; }
        .btn-aksi { display: block; width: 100%; background: #28a745; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-size: 14px; font-weight: bold; margin-bottom: 10px; text-decoration: none; box-sizing: border-box; }
        .btn-peta { background: #007BFF; }
    </style>
</head>
<body>

<div id="game-box">
    <!-- FOTO KARAKTER ANDA -->
    <img id="karakter" src="karakterpng.png" alt="Pemandu Wisata">
    
    <!-- KOTAK DIALOG EDUKASI -->
    <div id="dialog-box">
        <p id="teks-dialog">"Halo! Selamat datang di petualangan sejarah Gorontalo. Yuk, klik tombol biru di bawah untuk langsung berjalan-jalan virtual melihat wilayah sekitar Makam Raja Panipi!"</p>
    </div>

    <!-- TOMBOL JALAN-JALAN MENGGUNAKAN LAYANAN MAP OPEN-SOURCE (ANTI BLOKIR & ANTI ERROR) -->
    <a class="btn-aksi btn-peta" href="https://www.openstreetmap.org" target="_blank">🌐 MULAI JALAN-JALAN</a>
    
    <!-- TOMBOL EDUKASI SEJARAH -->
    <button class="btn-aksi" onclick="gantiTeks()">📜 PELAJARI SEJARAH</button>
</div>

<script>
    let info = [
        "Raja Bobihoe memimpin Kerajaan Panipi dan mengobarkan Perang Panipi melawan Belanda pada tahun 1872.",
        "Akibat perlawanan tersebut, beliau ditangkap lalu diasingkan oleh pihak Belanda.",
        "Kini, makam Raja Panipi terletak di Desa Barakati, Kecamatan Batudaa, Kabupaten Gorontalo.",
        "Yuk, bagikan game edukasi ini ke teman-temanmu untuk melestarikan sejarah lokal kita!"
    ];
    let indeks = 0;
    
    function gantiTeks() {
        if (indeks < info.length) {
            document.getElementById('teks-dialog').innerText = info[indeks];
            indeks = indeks + 1;
        } else {
            indeks = 0;
            document.getElementById('teks-dialog').innerText = "Yuk, bagikan game edukasi ini ke teman-temanmu untuk melestarikan sejarah lokal kita!";
        }
    }
</script>
</body>
</html>
