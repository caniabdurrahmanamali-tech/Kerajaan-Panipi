<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perjuangan Panipi: Amarah Raja Bobihoe</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #111;
            overflow: hidden;
        }

        #bg-video {
            position: fixed;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -1;
            transform: translate(-50%, -50%);
            object-fit: cover;
            opacity: 0.2;
        }

        #game-box {
            position: relative;
            z-index: 10;
            width: 95%;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            box-sizing: border-box;
        }

        #karakter {
            width: 110px;
            height: auto;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        #dialog-box {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        #teks-dialog {
            margin: 0;
            font-size: 13px;
            line-height: 1.5;
            color: #333;
        }

        #gameCanvas {
            background-color: #2e8b57;
            border: 3px solid #333;
            border-radius: 8px;
            display: none;
            margin: 0 auto 10px auto;
        }

        #status-teks {
            font-weight: bold;
            font-size: 14px;
            color: #333;
            margin: 5px 0;
            background: #f0f0f0;
            padding: 5px;
            border-radius: 5px;
            display: none;
        }

        .remote-container {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-width: 220px;
            margin: 10px auto;
        }

        .btn-control {
            background: #007BFF;
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            box-shadow: 0 4px #0056b3;
        }

        .btn-control:active {
            box-shadow: 0 1px #0056b3;
            transform: translateY(3px);
        }

        .btn-serang {
            background: #dc3545;
            box-shadow: 0 4px #bd2130;
        }

        .btn-serang:active {
            box-shadow: 0 1px #bd2130;
        }

        .empty-space {
            visibility: hidden;
        }

        .btn-aksi {
            display: block;
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border-radius: 5px;
            font-weight: bold;
            color: white;
            border: none;
            cursor: pointer;
        }
        
        .btn-sejarah { background: #007BFF; }
        .btn-mulai { background: #28a745; display: none; }
        .btn-restart { background: #ffc107; color: #000; display: none; }
    </style>
</head>
<body>

<video autoplay muted loop playsinline id="bg-video">
    <source src="video-bg.mp4" type="video/mp4">
</video>

<div id="game-box">
    <audio id="musik-game" src="lagu.mp3" loop autoplay controls style="width: 100%; margin-bottom: 10px;"></audio>
    
    <img id="karakter" src="karakter.png" alt="Pemandu Wisata">
    
    <div id="dialog-box">
        <p id="teks-dialog">Halo! Sebelum berperang, mari kita pelajari sejarahnya. Raja Bobihoe memimpin Kerajaan Panipi dan mengobarkan perang melawan Belanda pada tahun 1872. (Klik tombol biru untuk lanjut membaca sejarah)</p>
    </div>

    <div id="status-teks">Lawan: Bangsa Portugis | Sisa Musuh: 5</div>
    
    <canvas id="gameCanvas" width="350" height="240"></canvas>

    <div class="remote-container" id="remot-game">
        <div class="empty-space"></div>
        <button class="btn-control" onclick="gerakPrajurit('up')">▲</button>
        <div class="empty-space"></div>
        
        <button class="btn-control" onclick="gerakPrajurit('left')">◀</button>
        <button class="btn-control btn-serang" onclick="tembakPanah()">💥</button>
        <button class="btn-control" onclick="gerakPrajurit('right')">▶</button>
        
        <div class="empty-space"></div>
        <button class="btn-control" onclick="gerakPrajurit('down')">▼</button>
        <div class="empty-space"></div>
    </div>

    <button class="btn-aksi btn-sejarah" id="btn-baca" onclick="bacaSejarah()">LANJUT BACA SEJARAH</button>
    <button class="btn-aksi btn-mulai" id="btn-start" onclick="mulaiSesiPerang()">MULAI PERANG SEKARANG!</button>
    <button class="btn-aksi btn-restart" id="btn-ulang" onclick="resetGame()">ULANG PERANG</button>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const statusTeks = document.getElementById("status-teks");

    let infoSejarah = [
        "Akibat perlawanan gigih mempertahankan wilayah Panipi, Raja Bobihoe sempat ditangkap dan diasingkan oleh pihak Belanda.",
        "Kini, makam Raja Panipi terletak di Desa Barakati, Kecamatan Batudaa, Kabupaten Gorontalo.",
        "Tugasmu sekarang: Bantu pasukan Raja Bobihoe menghalau gelombang penjajah mulai dari Portugis, VOC, Hindia Belanda, hingga Jepang demi kemerdekaan Panipi!"
    ];
    let indeksSejarah = 0;

    const daftarLevel = ["Bangsa Portugis", "Pasukan VOC", "Hindia Belanda", "Tentara Jepang"];
    let indeksLevel = 0;
    let gameAktif = false;

    let prajurit = { x: 30, y: 100, width: 25, height: 25, speed: 15 };
    let amunisiPanah = [];
    let pasukanMusuh = [];
    let sisaMusuhLevelIni = 5;

    function bacaSejarah() {
        if (indeksSejarah < infoSejarah.length) {
            document.getElementById('teks-dialog').innerText = infoSejarah[indeksSejarah];
            indeksSejarah++;
        } else {
            document.getElementById('teks-dialog').innerText = "Sejarah selesai dipelajari! Klik tombol hijau di bawah untuk memimpin pasukan Panipi memasuki medan perang!";
            document.getElementById('btn-baca').style.display = 'none';
            document.getElementById('btn-start').style.display = 'block';
        }
    }

    function mulaiSesiPerang() {
        document.getElementById('karakter').style.display = 'none';
        document.getElementById('dialog-box').style.display = 'none';
        document.getElementById('btn-start').style.display = 'none';

        canvas.style.display = 'block';
        statusTeks.style.display = 'block';
        document.getElementById('remot-game').style.display = 'grid';
        document.getElementById('btn-ulang').style.display = 'block';

        gameAktif = true;
        munculkanMusuh();
        gameLoop();
    }

    function munculkanMusuh() {
        pasukanMusuh = [];
        sisaMusuhLevelIni = 5; 
        for (let i = 0; i < sisaMusuhLevelIni; i++) {
            pasukanMusuh.push({
                x: 220 + (Math.random() * 80),
                y: 20 + (i * 40),
                width: 20,
                height: 20,
                speedY: (Math.random() > 0.5 ? 1 : -1) * (1 + indeksLevel * 0.5)
            });
        }
        perbaruiStatus();
    }

    function perbaruiStatus() {
        if (!gameAktif) return;
        statusTeks.innerHTML = `Lawan: ${daftarLevel[indeksLevel]} | Sisa Musuh: ${sisaMusuhLevelIni}`;
    }

    function gerakPrajurit(arah) {
        if (!gameAktif) return;
        if (arah === 'up' && prajurit.y > 0) prajurit.y -= prajurit.speed;
        if (arah === 'down' && prajurit.y < canvas.height - prajurit.height) prajurit.y += prajurit.speed;
        if (arah === 'left' && prajurit.x > 0) prajurit.x -= prajurit.speed;
        if (arah === 'right' && prajurit.x < canvas.width / 2) prajurit.x += prajurit.speed;
    }

    function tembakPanah() {
        if (!gameAktif) return;
        amunisiPanah.push({
            x: prajurit.x + prajurit.width,
            y: prajurit.y + (prajurit.height / 2) - 2,
            width: 12,
            height: 4,
            speedX: 6
        });
    }

    function cekTabrakan(obj1, obj2) {
        return obj1.x < obj2.x + obj2.width &&
               obj1.x + obj1.width > obj2.x &&
               obj1.y < obj2.y + obj2.height &&
               obj1.y + obj1.height > obj2.y;
    }

    function update() {
        if (!gameAktif) return;

        amunisiPanah.forEach((panah, pIndeks) => {
            panah.x += panah.speedX;
            if (panah.x > canvas.width) amunisiPanah.splice(pIndeks, 1);
        });

        pasukanMusuh.forEach((musuh, mIndeks) => {
            musuh.y += musuh.speedY;
            if (musuh.y <= 0 || musuh.y + musuh.height >= canvas.height) {
                musuh.speedY *= -1;
            }

            musuh.x -= 0.15; 
            if (musuh.x <= 0) {
                gameAktif = false;
                statusTeks.innerHTML = "💥 PANIPI DIKUASAI! Game Over. Klik Ulang Perang.";
            }

            if (cekTabrakan(prajurit, musuh)) {
                gameAktif = false;
                statusTeks.innerHTML = "💀 PRAJURIT GUGUR! Game Over. Klik Ulang Perang.";
